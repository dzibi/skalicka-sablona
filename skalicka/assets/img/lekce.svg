.sk-an .sk-an-arml,.sk-an .sk-an-armr,.sk-an .sk-an-legl,.sk-an .sk-an-legr{transform-box:fill-box;animation-duration:1.1s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
