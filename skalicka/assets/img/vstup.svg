<svg class="sk-an" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Herna: bazének s míčky a vstupenka 150 Kč na celý den">
<style>
.sk-an .sk-an-ball{animation:sk-an-hop 1.6s cubic-bezier(.3,0,.4,1) infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes sk-an-hop{0%,100%{transform:translateY(0)}12%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-58px) rotate(25deg)}78%{transform:translateY(0)}}
.sk-an .sk-an-sun{animation:sk-an-spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sk-an-spin{to{transform:rotate(360deg)}}
.sk-an .sk-an-ticket{animation:sk-an-swing 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sk-an-swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sk-an .sk-an-pop{animation:sk-an-pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sk-an-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sk-an .sk-an-tw{animation:sk-an-tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sk-an-tw{0%,100%{transform:scale(.7) rotate(0)}50%{transform:scale(1.1) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.sk-an *{animation:none!important}}
</style>
